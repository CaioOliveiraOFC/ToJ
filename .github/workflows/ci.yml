# Integração contínua do ToJ.
#
# Antes disto o repositório não tinha workflow nenhum: "suíte verde" era uma
# afirmação sobre a máquina de quem rodou por último, e os checks "pending" que
# apareciam no pull request eram AUSÊNCIA de verificação, não aprovação.
#
# Quatro jobs, todos bloqueantes: testes, balanceamento (em fatias), a
# conferência das fatias e lint. Nasceu com um job informativo (`compat`, sem
# gate) para descobrir se o piso de 3.10 declarado no `pyproject.toml` era
# verdade; era, e a matriz foi absorvida pelo job `testes`.
name: CI

# `master` e a linha de integração do PvE, `phase/game-core`. As branches de
# correção (`fix/*`, `feature/*`) chegam a ela por pull request, e é o evento do
# PR que as valida: um gatilho de push nelas faria toda execução rodar duas
# vezes, inclusive a suíte de minutos.
on:
  push:
    branches: [master, phase/game-core]
  pull_request:
    branches: [master, phase/game-core]

# Um push novo cancela a execução anterior da mesma referência: a suíte de
# balanceamento leva minutos e não vale a pena rodar sobre commit superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_PADRAO: "3.11"
  # Ruff fixado: versão nova traz regra nova, e regra nova em CI já configurada
  # reprova código que não mudou. Subir a versão é uma decisão, não um efeito.
  RUFF_VERSAO: "0.16.6"

jobs:
  testes:
    name: Testes (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 é o piso declarado em `pyproject.toml` (`requires-python`).
        # A matriz nasceu como job `compat` separado e sem gate, porque essa
        # declaração nunca tinha sido executada. Duas execuções verdes em
        # 3.10 e 3.12 depois, a promessa está verificada e vira gate.
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Suíte rápida
        run: python -m pytest -q

  # Simula runs completas de 20 andares; leva minutos e fica fora da execução
  # padrão do pytest (`addopts` exclui `balance`). É a suíte que impede uma
  # mudança de constante de passar despercebida.
  #
  # Fatiada por arquivo. Num job só ela estourou os 25 minutos no push da
  # `v0.3-pve` (`97965ae`) e saiu como falha sem ter rodado inteira: o gate
  # existia e não verificava nada. Os fixtures são por classe e por módulo, então
  # a fatia por arquivo não refaz simulação. Os limites de tempo são da máquina,
  # não do balanceamento: nenhum threshold muda aqui.
  balanceamento:
    name: Balanceamento (${{ matrix.fatia }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fatia: bandas
            arquivos: tests/balance/test_balance_bands.py
          - fatia: scout
            arquivos: tests/balance/test_scout.py
          - fatia: pick_skill
            arquivos: tests/balance/test_pick_skill.py
          - fatia: arena
            arquivos: tests/test_arena_power.py tests/test_arena_alvo.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_PADRAO }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Suíte de balanceamento (${{ matrix.fatia }})
        timeout-minutes: 60
        run: python -m pytest -q -m balance ${{ matrix.arquivos }}

  # Um teste de balanceamento num arquivo novo ficaria fora de todas as fatias
  # sem ninguém perceber. Este job só COLETA (não simula nada) e reprova se o
  # conjunto de arquivos marcados com `balance` deixar de ser o das fatias.
  balanceamento-cobertura:
    name: Fatias cobrem todo o balanceamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_PADRAO }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Conferir as fatias
        run: |
          esperado="tests/balance/test_balance_bands.py tests/balance/test_pick_skill.py tests/balance/test_scout.py tests/test_arena_alvo.py tests/test_arena_power.py"
          coletado=$(python -m pytest --collect-only -q -m balance | grep "::" | cut -d: -f1 | sort -u | tr '\n' ' ' | sed 's/ $//')
          echo "coletado: $coletado"
          if [ "$coletado" != "$esperado" ]; then
            echo "::error::Os arquivos com testes de balanceamento mudaram. Atualize as fatias do job 'balanceamento'."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_PADRAO }}
          cache: pip

      - name: Instalar ruff
        run: pip install "ruff==${{ env.RUFF_VERSAO }}"

      # A régua inteira, sem exceção. Nasceu com `--ignore E501,W293` porque o
      # repositório carregava 178 ocorrências dessas duas regras, todas
      # anteriores à CI, e um gate que reprova código que ninguém tocou vira
      # ruído. A dívida foi zerada (`ruff format` no repositório inteiro, mais
      # 35 quebras manuais que o formatador não podia fazer), então o buraco
      # do gate fechou junto.
      - name: Regras
        run: ruff check src/ tests/ --output-format=github

      # Formatação deixa de ser opinião. Sem este passo, os 178 voltariam a
      # crescer um arquivo novo por vez.
      - name: Formatação
        run: ruff format --check src/ tests/
