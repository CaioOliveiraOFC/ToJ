# Integração contínua do ToJ.
#
# Antes disto o repositório não tinha workflow nenhum: "suíte verde" era uma
# afirmação sobre a máquina de quem rodou por último, e os checks "pending" que
# apareciam no pull request eram AUSÊNCIA de verificação, não aprovação.
#
# Três jobs, todos bloqueantes. Nasceu com um quarto job informativo
# (`compat`, sem gate) para descobrir se o piso de 3.10 declarado no
# `pyproject.toml` era verdade; era, e a matriz foi absorvida pelo job `testes`.
name: CI

# Pushes em branch de trabalho são cobertos pelo evento de pull request: gatilho
# duplo faria toda execução rodar duas vezes, inclusive a suíte de minutos.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Um push novo cancela a execução anterior da mesma referência: a suíte de
# balanceamento leva minutos e não vale a pena rodar sobre commit superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_PADRAO: "3.11"
  # Ruff fixado: versão nova traz regra nova, e regra nova em CI já configurada
  # reprova código que não mudou. Subir a versão é uma decisão, não um efeito.
  RUFF_VERSAO: "0.16.6"

jobs:
  testes:
    name: Testes (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 é o piso declarado em `pyproject.toml` (`requires-python`).
        # A matriz nasceu como job `compat` separado e sem gate, porque essa
        # declaração nunca tinha sido executada. Duas execuções verdes em
        # 3.10 e 3.12 depois, a promessa está verificada e vira gate.
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Suíte rápida
        run: python -m pytest -q

  balanceamento:
    name: Invariantes de balanceamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_PADRAO }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Simula runs completas de 20 andares; leva minutos e fica fora da
      # execução padrão do pytest (`addopts` exclui `balance_full`). É a suíte
      # que impede uma mudança de constante de passar despercebida.
      - name: Suíte de balanceamento
        timeout-minutes: 25
        run: python -m pytest -q -m "balance or balance_full"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_PADRAO }}
          cache: pip

      - name: Instalar ruff
        run: pip install "ruff==${{ env.RUFF_VERSAO }}"

      # A régua inteira, sem exceção. Nasceu com `--ignore E501,W293` porque o
      # repositório carregava 178 ocorrências dessas duas regras, todas
      # anteriores à CI, e um gate que reprova código que ninguém tocou vira
      # ruído. A dívida foi zerada (`ruff format` no repositório inteiro, mais
      # 35 quebras manuais que o formatador não podia fazer), então o buraco
      # do gate fechou junto.
      - name: Regras
        run: ruff check src/ tests/ --output-format=github

      # Formatação deixa de ser opinião. Sem este passo, os 178 voltariam a
      # crescer um arquivo novo por vez.
      - name: Formatação
        run: ruff format --check src/ tests/
