[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tales-of-the-journey"
version = "0.1.0"
description = "A dungeon crawler RPG game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich", "pyfiglet"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
# auto_test.py é um harness standalone que roda o jogo inteiro (não é pytest)
# balance_full fica fora da execução padrão: simula runs de 20 andares e leva
# minutos. Rode com `-m balance_full` ao fechar uma mudança de balanceamento.
addopts = "--ignore=tests/auto_test.py -m 'not balance_full'"
markers = [
    "balance: invariantes de balanceamento (simulação headless)",
    "balance_full: runs completas de masmorra; lento, roda sob demanda",
]
