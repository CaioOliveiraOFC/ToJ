[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tales-of-the-journey"
version = "0.1.0"
description = "A dungeon crawler RPG game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich", "pyfiglet"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
]
ignore = [
    # `from src.shared import combat_topics as T` é convenção do projeto, usada
    # em cinco arquivos: o alias curto mantém legível a linha de publicação de
    # evento (`_emit(publish, T.COMBAT_PHYSICAL_STRIKE, ...)`). Renomear para
    # minúscula alonga essas linhas sem ganhar clareza.
    "N812",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
# auto_test.py é um harness standalone que roda o jogo inteiro (não é pytest).
# `balance` fica fora da execução padrão: são bandas calibradas para o meta
# atual, que podem mudar com o design. O que não pode mudar sem ser bug está em
# tests/test_structural_invariants.py e roda sempre.
addopts = "--ignore=tests/auto_test.py -m 'not balance'"
markers = ["balance: medição de balanceamento; roda sob demanda"]
